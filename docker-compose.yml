---
x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-password}
  AWS_REGION: ${AWS_REGION:-us-east-1}

services:
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    build: spark/
    networks:
      - iceberg_net
    depends_on:
      rest:
        condition: service_started
      aws-init:
        condition: service_completed_successfully
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      <<: *s3-credentials
    ports:
      - 127.0.0.1:8888:8888
      - 127.0.0.1:8080:8080
      - 127.0.0.1:10000:10000
      - 127.0.0.1:10001:10001
    restart: unless-stopped
  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      - iceberg_net
    depends_on:
      aws-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8181:8181
    environment:
      <<: *s3-credentials
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    restart: unless-stopped
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-password}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data/rustfs0
    networks:
      - iceberg_net
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/logs
    restart: unless-stopped
  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/logs
    command: chown -R 10001:10001 /data/rustfs0 /logs
    restart: "no"
  aws-init:
    image: amazon/aws-cli:latest
    container_name: aws-init
    depends_on:
      - rustfs
    networks:
      - iceberg_net
    environment:
      <<: *s3-credentials
    entrypoint: >
      /bin/sh -c "
      until aws s3 ls --endpoint-url http://rustfs:9000 >/dev/null 2>&1; do echo '...waiting for rustfs...' && sleep 1; done;
      aws s3api head-bucket --bucket warehouse --endpoint-url http://rustfs:9000 2>/dev/null ||
      aws s3 mb s3://warehouse --endpoint-url http://rustfs:9000;
      echo 'Bucket warehouse ready'
      "
    restart: "no"

networks:
  iceberg_net:

volumes:
  rustfs_data:
  rustfs_logs:
